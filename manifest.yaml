id: hashgg
title: "HashGG"
version: 0.7.2.0
release-notes: "Sharing one server between two HashGG installations is now safe. Setting up a second machine against a server another was already using would quietly replace the first one's access, and mining on that machine stopped at its next reconnect — hours later, with nothing to connect the two events. Each installation now keeps its own access, and removing one leaves the others working.

If a port is already taken on your server, HashGG now says so plainly and offers you a free one instead of failing with a message from ssh. The setup script also warns you before you get that far.

This version also adds a section for making your Bitcoin node reachable from the internet. It cannot work on this version of StartOS — the bundled Bitcoin package rewrites its configuration on every start and only ever advertises its Tor address — so HashGG now explains that where you would look for it, rather than leaving it out with no reason given. StartOS 0.4.0 supports it fully. Mining is unaffected either way."
license: MIT
wrapper-repo: "https://github.com/paulscode/hashgg"
upstream-repo: "https://github.com/playit-cloud/playit-agent"
support-site: "https://github.com/paulscode/hashgg/issues"
marketing-site: "https://github.com/paulscode/hashgg"
build: ["make"]
description:
  short: "Expose Datum Gateway to the internet — playit.gg or VPS tunnel"
  long: |
    HashGG connects your Datum Gateway stratum port to the public internet
    with no port forwarding or static IP required. Choose between two tunnel
    options: playit.gg (~$3/month, fiat) or a VPS SSH tunnel (~EUR 6/month,
    paid in Bitcoin via BTCVPS for privacy). Both options monitor and
    auto-restart the tunnel. Miners anywhere can connect using the public
    endpoint displayed in the dashboard.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint.sh"
  args: []
  mounts:
    main: /root
  gpu-acceleration: false
hardware-requirements:
  arch:
    - x86_64
    - aarch64
health-checks:
  tunnel:
    name: "Tunnel Status"
    success-message: "Tunnel is connected. Miners can connect to the public endpoint."
    type: docker
    image: main
    system: false
    entrypoint: check-tunnel.sh
    args: []
    mounts:
      main: /root
    io-format: json
    inject: true
  datum:
    name: "Datum Gateway Reachable"
    success-message: "Datum Gateway stratum port is accessible."
    type: docker
    image: main
    system: false
    entrypoint: check-datum.sh
    args: []
    mounts: {}
    io-format: json
    inject: true
config:
  get:
    type: script
  set:
    type: script
properties:
  type: script
volumes:
  main:
    type: data
interfaces:
  main:
    name: "HashGG Dashboard"
    description: "Web UI for managing the HashGG tunnel (playit.gg or VPS SSH)"
    tor-config:
      port-mapping:
        80: "3000"
    lan-config:
      443:
        ssl: true
        internal: 3000
    ui: true
    protocols:
      - tcp
      - http
dependencies:
  datum:
    version: ">=0.4.0"
    requirement:
      type: "required"
    description: "Datum Gateway provides the stratum server that HashGG exposes to the internet."
    config: ~
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /root
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /root
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
